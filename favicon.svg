<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#14161A"/>
  <!-- Two mirrored S-forms referencing "Solid State", built from straight
       diagonal segments (not the rounded/generic S glyph) so the mark stays
       legible at 16px and reads as a distinct geometric device, not type. -->
  <path d="M9 9 H20 L9 16 H20 L9 23 H20"
        fill="none" stroke="#FAFAF9" stroke-width="2.6"
        stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="20" y="14.6" width="3.4" height="3.4" fill="#D8551E"/>
</svg>
